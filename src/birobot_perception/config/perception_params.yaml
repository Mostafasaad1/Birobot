birobot_perception_node:
  ros__parameters:
    input_cloud_topic: "/birobot/depth_camera/points"
    target_frame: "world"
    ransac_distance_threshold: 0.015
    ransac_max_iterations: 1000
    cluster_tolerance: 0.02
    min_cluster_size: 50
    max_cluster_size: 25000
    max_tracked_objects: 2
    target_tf_prefix: "grasp_target_"
    diagnostic_rate_hz: 1.0
    min_valid_points: 1000
